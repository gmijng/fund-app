<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>基金估值</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F5F5F5; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #4A90D9, #357ABD); color: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .header h1 { font-size: 20px; margin-bottom: 5px; }
        .header .subtitle { opacity: 0.9; font-size: 13px; }
        .summary-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .summary-row:last-child { border-bottom: none; }
        .summary-label { color: #666; font-size: 14px; }
        .summary-value { font-weight: bold; font-size: 16px; }
        .summary-value.red { color: #C62828; }
        .summary-value.green { color: #2E7D32; }
        .fund-list { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .fund-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .fund-item:last-child { border-bottom: none; }
        .fund-info { flex: 1; }
        .fund-name { font-weight: bold; color: #333; font-size: 15px; margin-bottom: 4px; }
        .fund-code { font-size: 12px; color: #999; }
        .fund-value { text-align: right; margin-right: 10px; }
        .fund-price { font-size: 16px; font-weight: bold; color: #333; }
        .fund-change { font-size: 13px; }
        .fund-change.up { color: #C62828; }
        .fund-change.down { color: #2E7D32; }
        .delete-btn { background: #FF6B6B; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .add-section { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-top: 15px; }
        .add-section h2 { font-size: 16px; color: #333; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #4A90D9; }
        .submit-btn { width: 100%; padding: 14px; background: #4A90D9; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #357ABD; }
        .empty-state { text-align: center; padding: 40px; color: #999; font-size: 14px; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .error-msg { color: #C62828; font-size: 13px; margin-top: 8px; text-align: center; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px; text-align: center; background: white; border-radius: 8px; cursor: pointer; font-size: 14px; color: #666; }
        .tab.active { background: #4A90D9; color: white; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>基金估值</h1>
            <div class="subtitle">实时估算涨跌</div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showPage('list')">我的基金</div>
            <div class="tab" onclick="showPage('add')">添加基金</div>
        </div>

        <div id="page-list" class="page active">
            <div class="summary-card">
                <div class="summary-row">
                    <span class="summary-label">总投入(元)</span>
                    <span class="summary-value" id="total-invest">0.00</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">今日收益(元)</span>
                    <span class="summary-value" id="total-profit">0.00</span>
                </div>
            </div>

            <div class="fund-list">
                <div id="funds-container"></div>
                <div id="empty-state" class="empty-state">暂无基金，点击"添加基金"添加</div>
            </div>
        </div>

        <div id="page-add" class="page">
            <div class="add-section">
                <h2>添加基金</h2>
                <div class="form-group">
                    <label>基金代码</label>
                    <input type="text" id="fund-code" placeholder="如：000001">
                </div>
                <div class="form-group">
                    <label>投入金额(元)</label>
                    <input type="number" id="fund-invest" placeholder="如：10000">
                </div>
                <div class="form-group">
                    <label>今日收益(元)</label>
                    <input type="number" id="fund-profit" placeholder="正数赚钱，负数亏钱">
                </div>
                <div id="error-msg" class="error-msg" style="display: none;"></div>
                <button class="submit-btn" onclick="addFund()">添加</button>
            </div>
        </div>
    </div>

    <script>
        let funds = JSON.parse(localStorage.getItem('funds_v3')) || [];

        function saveFunds() {
            localStorage.setItem('funds_v3', JSON.stringify(funds));
        }

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            event.target.classList.add('active');
            if (page === 'list') renderFunds();
        }

        async function fetchFund(code) {
            try {
                const url = `https://fundgz.1234567.com.cn/js/${code}.js?rt=${Date.now()}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                const res = await fetch(proxyUrl);
                const text = await res.text();
                const match = text.match(/jsonpgz\(\{(.+)\}\)/);
                if (match) {
                    const data = JSON.parse(`{${match[1]}}`);
                    return { name: data.name, gszzl: parseFloat(data.gszzl) };
                }
            } catch (e) {}
            return null;
        }

        async function addFund() {
            const code = document.getElementById('fund-code').value.trim();
            const invest = parseFloat(document.getElementById('fund-invest').value);
            const profit = parseFloat(document.getElementById('fund-profit').value);
            const errorMsg = document.getElementById('error-msg');

            errorMsg.style.display = 'none';

            if (!code || isNaN(invest) || isNaN(profit)) {
                errorMsg.textContent = '请填写所有字段';
                errorMsg.style.display = 'block';
                return;
            }

            if (funds.find(f => f.code === code)) {
                errorMsg.textContent = '该基金已添加';
                errorMsg.style.display = 'block';
                return;
            }

            const data = await fetchFund(code);
            funds.push({
                code: code,
                name: data ? data.name : code,
                invest: invest,
                profit: profit,
                gszzl: data ? data.gszzl : null
            });

            saveFunds();

            document.getElementById('fund-code').value = '';
            document.getElementById('fund-invest').value = '';
            document.getElementById('fund-profit').value = '';

            showPage('list');
        }

        function deleteFund(code) {
            if (confirm('确定删除该基金？')) {
                funds = funds.filter(f => f.code !== code);
                saveFunds();
                renderFunds();
            }
        }

        async function renderFunds() {
            const container = document.getElementById('funds-container');
            const emptyState = document.getElementById('empty-state');

            if (funds.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                updateSummary();
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = '<div class="loading">正在获取数据...</div>';

            let totalInvest = 0;
            let totalProfit = 0;
            let html = '';

            for (const fund of funds) {
                const data = await fetchFund(fund.code);
                if (data) {
                    fund.name = data.name;
                    fund.gszzl = data.gszzl;
                }

                totalInvest += fund.invest;
                totalProfit += fund.profit;

                const isUp = fund.profit >= 0;
                const arrow = isUp ? '↑' : '↓';
                const cls = isUp ? 'up' : 'down';

                html += `
                    <div class="fund-item">
                        <div class="fund-info">
                            <div class="fund-name">${fund.name}</div>
                            <div class="fund-code">${fund.code}</div>
                        </div>
                        <div class="fund-value">
                            <div class="fund-price">¥${fund.invest.toFixed(2)}</div>
                            <div class="fund-change ${cls}">${arrow} ${Math.abs(fund.profit).toFixed(2)} ${fund.gszzl ? '(' + (isUp ? '+' : '') + fund.gszzl + '%)' : ''}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteFund('${fund.code}')">删除</button>
                    </div>
                `;
            }

            container.innerHTML = html;
            saveFunds();
            updateSummary();
        }

        function updateSummary() {
            const totalInvest = funds.reduce((sum, f) => sum + f.invest, 0);
            const totalProfit = funds.reduce((sum, f) => sum + f.profit, 0);

            const investEl = document.getElementById('total-invest');
            const profitEl = document.getElementById('total-profit');

            investEl.textContent = totalInvest.toFixed(2);
            profitEl.textContent = (totalProfit >= 0 ? '+' : '') + totalProfit.toFixed(2);
            profitEl.className = 'summary-value ' + (totalProfit >= 0 ? 'red' : 'green');
        }

        if (funds.length > 0) {
            renderFunds();
        } else {
            document.getElementById('empty-state').style.display = 'block';
        }
    </script>
</body>
</html>
